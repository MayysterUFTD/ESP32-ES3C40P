; Active Exhaust Controller — ESP32-S3 DevKitC-1-N8R8
[env:esp32-s3-devkitc-1-n8r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.filesystem = littlefs
build_src_filter =
    +<*>
    -<main.cpp>
    +<main_thermal.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0
board_upload.flash_size = 8MB
upload_protocol = esptool
monitor_speed = 115200
lib_deps =
    https://github.com/MayysterUFTD/WDCP.git
    adafruit/Adafruit MLX90640@^1.1.2

[env:es3c40p]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_src_filter =
    +<*>
    -<main_thermal.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    https://github.com/lvgl/lvgl.git#v9.6.0
    moononournation/GFX Library for Arduino@^1.6.4
monitor_speed = 115200